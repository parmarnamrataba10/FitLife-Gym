[build]
  command = "npm run netlify:build"
  publish = "client/dist"
  functions = "server/netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "server/netlify/functions"
  node_bundler = "esbuild"
  node_version = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200